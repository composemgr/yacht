name: yacht
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: selfhostedpro/yacht:latest
    container_name: yacht
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: yacht
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
      ADMIN_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      DISABLE_AUTH: 'false'
    volumes:
      - './volumes/config/yacht:/config:z'
      - '/var/run/docker.sock:/var/run/docker.sock:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://yacht:8000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - yacht
      - cloudflare

networks:
  yacht:
    name: yacht
    external: false
  cloudflare:
    external: true
